    <text x="390" y="658" text-anchor="end" font-size="12" font-weight="bold" fill="#0f172a">NET DISBURSED AMOUNT:</text>
    <text x="735" y="659" text-anchor="end" font-size="16" font-weight="900" font-family="monospace" fill="#047857">₱18,000.00</text>


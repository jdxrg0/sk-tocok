    <text x="65" y="315" font-size="13" font-weight="bold" fill="#0f172a">SK Mandatory Training &amp; Leadership Capability Seminar Registration</text>
    
    <text x="65" y="346" font-size="11" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
